apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: flipkart-frontend

  template:
    metadata:
      labels:
        app: flipkart-frontend

    spec:
      containers:
        - name: flipkart-frontend
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/flipkart-frontend:latest
          ports:
            - containerPort: 80
